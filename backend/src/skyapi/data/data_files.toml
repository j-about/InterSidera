# InterSidera data registry (decisions D29, D30; brief l.305, l.326).
#
# One `[[files]]` table per dataset of docs/brief.xml l.303-321, downloads and other kinds
# alike, so that `sky-data status` and THIRD_PARTY_NOTICES.md list every dataset with its
# license. Loaded by `skyapi.data.registry.load_registry()`; mirrored by docs/data.md;
# rendered by `python -m skyapi.tools.render_notices` (`make notices`).
#
# Fields
#   key               short identifier used by `sky-data fetch --only KEY` and the manifests
#   kind              download | builtin | committed | runtime_service | ui_asset
#   filename          name of the file as it lies in DATA_DIR (downloads) or a display name
#   url               primary source (required for downloads; informative otherwise)
#   fallback_urls     tried in order after the primary fails
#   size_bytes        exact size of the file as it lies on disk; 0 when refreshable (unknown)
#   sha256            pinned SHA-256 of the file as it lies on disk (immutable files only)
#   sha256_pending    true while an immutable file has no pin yet: `fetch` records the observed
#                     hash into DATA_DIR/manifest.json and `verify` compares against it, exactly
#                     like a refreshable file, until a pin is added here
#   gunzip            the transfer is a gzip stream inflated to `filename`; both hashes recorded
#   min_size_bytes    smallest acceptable transfer (catches error pages and LFS pointers)
#   group             ephemeris | kernels | stars | names | dso | constellations | mpc |
#                     earth_orientation | geocoder | sites | ui
#   required          missing -> API not ready; false -> degraded (brief l.280)
#   optional          fetched only with `--only KEY` (never by a default `fetch`)
#   refresh           never | rarely | yearly | weekly | when_naif_revises
#   license           SPDX id or short license name (never empty)
#   copyright         holder line reproduced in the notices
#   license_file      license text under skyapi/data/licenses/, reproduced in the notices
#   attribution       the attribution text of brief l.303-321 (never empty)
#   version_or_date   static version text printed by the notices (never a run-time timestamp)
#   notes             loader notes, format documents, quirks
#
# Refreshable files (no `sha256`) are still SHA-256 verified end to end: the downloader records
# the observed hash into DATA_DIR/manifest.json and `verify` compares the file against it (D30).

