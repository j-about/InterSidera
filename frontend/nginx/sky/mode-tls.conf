# nginx terminates TLS (compose.tls.yaml): certificates at /etc/nginx/certs/{fullchain,privkey}.pem;
# Mozilla "intermediate" parameters; HSTS comes from the $sky_hsts map on https connections only.
server {
    listen 80 default_server;
    server_name _;
    location = /healthz { access_log off; return 204; }
    location /          { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SkyTLS:10m;
    ssl_session_tickets off;
    include /etc/nginx/sky/app.conf;
}
