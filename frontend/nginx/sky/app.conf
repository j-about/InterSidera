# The application server body, included by both modes: the SPA with its fallback, the hashed assets
# and their precompressed siblings, the dotfile and Swagger 404s, the /api proxy, the health path.
root  /usr/share/nginx/html;
index index.html;
charset utf-8;

gzip_static on;
gzip_vary   on;

location / {
    try_files $uri /index.html;
}
location ~ /\. {
    return 404;
}
location = /api/v1/docs  { return 404; }
location = /api/v1/docs/ { return 404; }
location ^~ /api/ {
    proxy_pass http://skyapi;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_max_temp_file_size 16m;
}
location = /healthz {
    access_log off;
    return 204;
}
