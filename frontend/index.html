<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Nominatim identifies the caller by its Referer (brief l.554); browsers cannot set User-Agent. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#05070f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS reads apple-touch-icon, not the manifest; opaque so it never shows as a black square (B-66). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>InterSidera</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
