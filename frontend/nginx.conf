# InterSidera web tier (docs/architecture.md "Deployment"). Rendered pieces live in
# /etc/nginx/conf.d/ (the image entrypoint runs envsubst on /etc/nginx/templates/*.template for
# the SKY_* variables only). nginx >= 1.30.4 (map regex + non-cacheable variables).
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }
    default_type  application/octet-stream;

    server_tokens off;

    # No request line, query string, referer, user agent or client address (privacy).
    log_format sky escape=json
        '{"time":"$time_iso8601","status":$status,"method":"$request_method","path":"$uri",'
        '"bytes":$body_bytes_sent,"request_time_s":$request_time,'
        '"upstream_time_s":"$upstream_response_time","request_id":"$upstream_http_x_request_id"}';
    access_log  /var/log/nginx/access.log sky;
    # Request-bound error lines carry the client address and the query string: crit and above only.
    error_log   /var/log/nginx/error.log crit;
    log_not_found off;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65s;
    client_max_body_size 16k;

    gzip off;

    upstream skyapi {
        zone skyapi 64k;
        server api:8000 resolve;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        keepalive 16;
        keepalive_timeout 4s;
    }

    include /etc/nginx/conf.d/*.conf;
}
