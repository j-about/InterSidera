name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly (Monday 06:17 UTC): the `audit` job alone, so new advisories surface between commits.
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI never downloads de441 or MPCORB and never contacts Nominatim or Horizons (brief: engineering_standards/ci).
  SKYAPI_AUTO_FETCH: "false"
  SKYAPI_EPHEMERIS: de440s.bsp

jobs:
  backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # pyright (PyPI) is a Node wrapper: it needs node on PATH and downloads the npm package once.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pyright-python
          key: pyright-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: pyright-${{ runner.os }}-
      # setup-uv publishes no floating major tag after v7 (v8-v10 exist only as full tags), so the
      # action is pinned to the commit of v10.0.1 as its README does; `@v10` fails at resolution.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"   # resolved relative to working-directory (backend/)
      # --locked asserts that uv.lock is current (make check runs `uv lock --check` for the same purpose).
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ruff format --check --config pyproject.toml ../scripts
      - run: uv run ruff check --config pyproject.toml ../scripts
      - run: uv run pyright
      # scripts/ lies outside `[tool.pyright] include`; both scripts are checked in basic mode (B-47).
      - run: uv run pyright ../scripts/bench_api.py ../scripts/generate_fixtures.py
      # Test kernels (de440s + PCK/Moon kernels, ~46 MB, public domain): restored from the cache, downloaded by
      # the session fixture through the data registry on a miss, saved even when the tests fail.
      - uses: actions/cache/restore@v6
        id: kernels
        with:
          path: |
            data/*.bsp
            data/*.tpc
            data/*.tf
            data/*.bpc
          key: kernels-${{ hashFiles('backend/src/skyapi/data/data_files.toml') }}
      - run: uv run pytest -m "not slow" --cov=skyapi.astro --cov=skyapi.catalogs --cov-report=term-missing:skip-covered
      - uses: actions/cache/save@v6
        if: always() && steps.kernels.outputs.cache-hit != 'true'
        with:
          path: |
            data/*.bsp
            data/*.tpc
            data/*.tf
            data/*.bpc
          key: kernels-${{ hashFiles('backend/src/skyapi/data/data_files.toml') }}
      # Coverage gates per package (brief l.294): astro and catalogs >= 90 %, the two pure modules 100 %.
      - run: uv run coverage report --include='src/skyapi/astro/*' --fail-under=90
      - run: uv run coverage report --include='src/skyapi/catalogs/*' --fail-under=90
      - run: uv run coverage report --include='src/skyapi/astro/quaternions.py,src/skyapi/catalogs/formats.py' --fail-under=100
      # Contract drift gate, backend half: the committed OpenAPI document must match the code.
      - run: uv run python -m skyapi.tools.dump_openapi --out ../docs/openapi.json
      - run: git ls-files --error-unmatch -- ../docs/openapi.json && git diff --exit-code -- ../docs/openapi.json
      # Notices drift gate: THIRD_PARTY_NOTICES.md and the About-screen credits are rendered from
      # the data registry, never hand-edited.
      - run: uv run python -m skyapi.tools.render_notices --out ../THIRD_PARTY_NOTICES.md --json ../frontend/src/data/credits.json
      - run: git ls-files --error-unmatch -- ../THIRD_PARTY_NOTICES.md ../frontend/src/data/credits.json && git diff --exit-code -- ../THIRD_PARTY_NOTICES.md ../frontend/src/data/credits.json

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Resolved against the repository root, not the job working directory.
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # Contract drift gate, frontend half: generated types must match the committed OpenAPI document.
      - run: npm run gen:types
      - run: git ls-files --error-unmatch -- src/api/schema.d.ts && git diff --exit-code -- src/api/schema.d.ts
      # Every scripts/*.mjs is syntax-checked and formatted (make check-i18n).
      - run: for f in ../scripts/*.mjs; do node --check "$f"; done
      - run: npm exec -- prettier --no-config --print-width 100 --single-quote --check ../scripts
      - run: node ../scripts/check_i18n.mjs
      # The nginx tree of the web image diffed against frontend/security-headers.ts (make check-delivery).
      - run: node ../scripts/check_nginx_headers.mjs
      - run: npm run build
      # The production build never contains the window.__sky debug hook (brief l.410; make build).
      - run: '! grep -rl "__sky" dist/assets'
      # The AR, WebXR and WebGPU code stays in lazy chunks (brief l.257, l.478; plan D131; make build).
      - run: node ../scripts/check_chunks.mjs dist

  # End-to-end (M3, extended at M4 and M5): the API on de440s with the full star, DSO and constellation
  # data (never de441 or MPCORB: the API then reports `degraded` with `missing: ["mpc"]`, which the
  # suite accepts), the e2e build of the frontend (`vite build --mode e2e` exposes window.__sky) and
  # Playwright Chromium on the two projects `make e2e` runs; `ar.spec.ts` runs on `chromium-mobile`
  # only, in its own worker with the fake camera flags and the sensor permissions (plan D134). The
  # `chromium-webgpu` project is configured but unmeasured on a GPU-less runner (docs/testing.md,
  # plan.md maintainer question 16).
  e2e:
    if: github.event_name != 'schedule'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # 45 min: the job measured 18.6 min under these settings on a warm machine (one worker, warm npm
    # and uv caches, the browser installed, no apt step; docs/testing.md "End-to-end"), so a cold or
    # slower runner keeps a margin.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 (see the backend job)
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      # Data for the e2e API (about 113 MB of pinned files plus the small refreshable catalogs) with the
      # built caches, restored from the cache and rebuilt when the registry or the cache builders change.
      - uses: actions/cache/restore@v6
        id: e2e-data
        with:
          path: data
          key: e2e-data-${{ hashFiles('backend/src/skyapi/data/data_files.toml', 'backend/src/skyapi/catalogs/*.py', 'backend/src/skyapi/data/caches.py') }}
      - run: uv run --directory backend sky-data fetch --only de440s pck00011 moon_tf moon_bpc hipparcos hyg ngc ngc_addendum stellarium_modern stellarium_description d3_bounds
      - run: uv run --directory backend sky-data build-caches
      - uses: actions/cache/save@v6
        if: always() && steps.e2e-data.outputs.cache-hit != 'true'
        with:
          path: data
          key: e2e-data-${{ hashFiles('backend/src/skyapi/data/data_files.toml', 'backend/src/skyapi/catalogs/*.py', 'backend/src/skyapi/data/caches.py') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      # `npm exec`, never a root `npx` (CLAUDE.md); installs Chromium, its headless shell and the system libraries.
      - run: npm exec -- playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build:e2e
        working-directory: frontend
      - run: npm run e2e -- --project=chromium-desktop --project=chromium-mobile
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      # Lighthouse accessibility audit (brief l.290, plan D155; `make lighthouse`): Playwright stops
      # its web servers with the run, so the API (same environment as playwright.config.ts) and the
      # e2e preview are restarted in the background, `/health` polled until it answers 200 (`ready`,
      # or `degraded` without MPCORB; 503 while `starting`) and the six URLs scored (>= 0.9 each).
      # The script pins lighthouse through `npm exec --package`, never a root `npx`. Both servers
      # write to files under $RUNNER_TEMP, uploaded with the reports below: the runner abandons the
      # output a background process inherits from its step, and a failing audit must be diagnosable
      # from the API side (a 503, a bootstrap error).
      - run: SKYAPI_AUTO_FETCH=false SKYAPI_EPHEMERIS=de440s.bsp uv run --directory backend fastapi run --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
      - run: npm --prefix frontend run preview > "$RUNNER_TEMP/preview.log" 2>&1 &
      - run: |
          for i in $(seq 1 120); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:4173/
      - run: node scripts/lighthouse.mjs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          # A `with:` input is not a shell line: the runner.temp context, not $RUNNER_TEMP.
          path: |
            reports/lighthouse
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/preview.log
          if-no-files-found: ignore
          retention-days: 7

  # Dependency audits (brief l.276; plan D151; backlog B-86): `npm audit` and `pip-audit` need the
  # registries and their answers change over time without a commit, so they stay outside the
  # hermetic `make check` and run here, on every push and pull request and on the weekly schedule
  # (the three other jobs skip scheduled runs). Same four commands as `make audit`; no `npm ci`
  # (`--package-lock-only` reads the lockfile) and no `uv sync` (`uv export --frozen` reads uv.lock).
  # scripts/check_audit.mjs compares both reports with scripts/audit-allowlist.json.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 (see the backend job)
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - run: npm --prefix frontend audit --json --package-lock-only > "$RUNNER_TEMP/npm-audit.json" || true
      - run: uv export --quiet --directory backend --frozen --format requirements.txt --no-emit-project --no-hashes --all-groups -o "$RUNNER_TEMP/requirements.txt"
      - run: uv tool run pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --strict --disable-pip --progress-spinner off -f json -o "$RUNNER_TEMP/pip-audit.json" || true
      - run: node scripts/check_audit.mjs --npm "$RUNNER_TEMP/npm-audit.json" --python "$RUNNER_TEMP/pip-audit.json"

  # docker (M7; brief l.427): both images built with docker/build-push-action on linux/amd64 only
  # (brief l.270; arm64 is what `make images` builds on the aarch64 development machine), never
  # pushed, loaded into the runner's daemon and exercised exactly as `make images` does. The layer
  # cache lives in the GitHub Actions cache (type=gha, one scope per image, mode=max). Nothing is
  # uploaded; the size and smoke figures are the log lines copied into docs/testing.md.
  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: docker run --rm -i ghcr.io/hadolint/hadolint:v2.15.1 < backend/Dockerfile
      - run: docker run --rm -i ghcr.io/hadolint/hadolint:v2.15.1 < frontend/Dockerfile
      - run: docker build --check -f backend/Dockerfile backend
      - run: docker build --check -f frontend/Dockerfile frontend
      # No .env in CI: the compose files must parse on their defaults alone. Validated before the
      # two builds, in the order of `make images`, so a compose error costs seconds, not the builds.
      - run: docker compose config -q
      - run: docker compose -f compose.yaml -f compose.tls.yaml config -q
      - run: docker compose -f compose.yaml -f compose.e2e.yaml config -q
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          provenance: false
          tags: intersidera-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          provenance: false
          tags: intersidera-web:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - run: node scripts/check_images.mjs --api intersidera-api:ci --web intersidera-web:ci
