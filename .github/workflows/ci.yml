name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI never downloads de441 or MPCORB and never contacts Nominatim or Horizons (brief: engineering_standards/ci).
  SKYAPI_AUTO_FETCH: "false"
  SKYAPI_EPHEMERIS: de440s.bsp

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # pyright (PyPI) is a Node wrapper: it needs node on PATH and downloads the npm package once.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pyright-python
          key: pyright-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: pyright-${{ runner.os }}-
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"   # resolved relative to working-directory (backend/)
      # --locked asserts that uv.lock is current (make check runs `uv lock --check` for the same purpose).
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ruff format --check --config pyproject.toml ../scripts
      - run: uv run ruff check --config pyproject.toml ../scripts
      - run: uv run pyright
      # scripts/ lies outside `[tool.pyright] include`; both scripts are checked in basic mode (B-47).
      - run: uv run pyright ../scripts/bench_api.py ../scripts/generate_fixtures.py
      # Test kernels (de440s + PCK/Moon kernels, ~46 MB, public domain): restored from the cache, downloaded by
      # the session fixture through the data registry on a miss, saved even when the tests fail.
      - uses: actions/cache/restore@v6
        id: kernels
        with:
          path: |
            data/*.bsp
            data/*.tpc
            data/*.tf
            data/*.bpc
          key: kernels-${{ hashFiles('backend/src/skyapi/data/data_files.toml') }}
      - run: uv run pytest -m "not slow" --cov=skyapi.astro --cov=skyapi.catalogs --cov-report=term-missing:skip-covered
      - uses: actions/cache/save@v6
        if: always() && steps.kernels.outputs.cache-hit != 'true'
        with:
          path: |
            data/*.bsp
            data/*.tpc
            data/*.tf
            data/*.bpc
          key: kernels-${{ hashFiles('backend/src/skyapi/data/data_files.toml') }}
      # Coverage gates per package (brief l.294): astro and catalogs >= 90 %, the two pure modules 100 %.
      - run: uv run coverage report --include='src/skyapi/astro/*' --fail-under=90
      - run: uv run coverage report --include='src/skyapi/catalogs/*' --fail-under=90
      - run: uv run coverage report --include='src/skyapi/astro/quaternions.py,src/skyapi/catalogs/formats.py' --fail-under=100
      # Contract drift gate, backend half: the committed OpenAPI document must match the code.
      - run: uv run python -m skyapi.tools.dump_openapi --out ../docs/openapi.json
      - run: git ls-files --error-unmatch -- ../docs/openapi.json && git diff --exit-code -- ../docs/openapi.json
      # Notices drift gate: THIRD_PARTY_NOTICES.md is rendered from the data registry, never hand-edited.
      - run: uv run python -m skyapi.tools.render_notices --out ../THIRD_PARTY_NOTICES.md
      - run: git ls-files --error-unmatch -- ../THIRD_PARTY_NOTICES.md && git diff --exit-code -- ../THIRD_PARTY_NOTICES.md

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Resolved against the repository root, not the job working directory.
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # Contract drift gate, frontend half: generated types must match the committed OpenAPI document.
      - run: npm run gen:types
      - run: git ls-files --error-unmatch -- src/api/schema.d.ts && git diff --exit-code -- src/api/schema.d.ts
      - run: node --check ../scripts/check_i18n.mjs
      - run: node ../scripts/check_i18n.mjs
      - run: npm exec -- prettier --no-config --print-width 100 --single-quote --check ../scripts
      - run: npm run build

  # e2e (M3): needs [backend, frontend]; starts the API on de440s and serves the built frontend;
  #           `npx playwright install --with-deps chromium`; runs chromium-desktop and chromium-mobile;
  #           actions/upload-artifact@v7 (if: ${{ !cancelled() }}, path: frontend/test-results and
  #           frontend/playwright-report, if-no-files-found: ignore).
  # docker (M7): docker/setup-buildx-action@v4 + docker/build-push-action@v7 for both images
  #           (push: false, platforms: linux/amd64).
